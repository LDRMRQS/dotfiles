# hypridle — praticamente idêntico à config antiga: essa parte é lógica de timeout/energia,
# não tem cor nenhuma envolvida, então (mesmo princípio do hyprpaper.conf, doc 07) NÃO precisou
# virar `.tmpl` — é copiado por chezmoi como arquivo estático, sem passar pelo motor de template.
# NÃO editar o arquivo final direto (~/.config/hypr/hypridle.conf) — editar este arquivo aqui no
# repo e rodar `chezmoi apply`.

general {
    lock_cmd = pidof hyprlock || hyprlock       # evita abrir múltiplas instâncias do hyprlock
    before_sleep_cmd = loginctl lock-session    # bloqueia antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # evita ter que apertar tecla 2x pra tela voltar
}

listener {
    timeout = 300                              # 5min — bloqueia a tela
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                  # 5.5min — tela apaga
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r        # volta ao detectar atividade
}

listener {
    timeout = 1800                             # 30min — suspende o notebook
    on-timeout = systemctl suspend
}
