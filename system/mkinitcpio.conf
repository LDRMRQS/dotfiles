# system/mkinitcpio.conf — arquivo de REFERÊNCIA (doc 06: domínio system/, copiado por
# bootstrap.sh pra /etc/mkinitcpio.conf com sudo, seguido de `mkinitcpio -P`).
#
# Implementa a decisão do doc 01/04: LUKS2 + desbloqueio automático via TPM2
# (systemd-cryptenroll) + Btrfs. Usa os HOOKS baseados em systemd (não os hooks clássicos
# `encrypt`/`udev`) porque é o caminho suportado pelo `systemd-cryptenroll`/`sd-encrypt` pra
# desbloqueio via TPM2 dentro do initramfs — o hook clássico `encrypt` não sabe conversar com o
# TPM, só pede passphrase manual.
#
# MODULES fica vazio de propósito: o Btrfs não precisa de módulo extra no initramfs (já vem
# embutido no kernel `linux-cachyos-lts`), e não há necessidade de driver de GPU aqui (a VM
# Windows não usa passthrough de GPU, doc 01 — sem IOMMU/vfio-pci envolvido).
MODULES=()

BINARIES=()

FILES=()

# base           — sempre primeiro
# systemd        — initramfs baseado em systemd (em vez do initramfs clássico BusyBox-like),
#                  necessário pro sd-encrypt funcionar
# autodetect     — reduz o initramfs só aos módulos que essa máquina específica precisa
# microcode      — carrega o intel-ucode (doc 02) antes de mais nada
# modconf        — respeita /etc/modprobe.d/ dentro do initramfs
# kms            — modesetting antecipado (evita flicker de resolução no boot)
# keyboard       — teclado disponível cedo o bastante pra digitar PIN/passphrase se precisar
#                  (fallback caso o TPM não libere sozinho, doc 04)
# sd-vconsole    — aplica o layout de teclado (kb_layout us,br do doc 07 é config do Hyprland,
#                  não do console; aqui é só o vconsole.conf padrão da instalação)
# block          — detecta o disco/controlador de armazenamento
# sd-encrypt     — abre o volume LUKS2 via systemd, incluindo tentativa de desbloqueio por TPM2
#                  enrolado com `systemd-cryptenroll --tpm2-device=auto` (doc 04) — cai pra
#                  pedir passphrase manual se o TPM não validar a cadeia de boot esperada
# filesystems    — monta os subvolumes Btrfs (@, @home, @var_log, @snapshots, @vm-images — doc 01)
# fsck           — checagem de filesystem se necessário
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck)

COMPRESSION="zstd"
