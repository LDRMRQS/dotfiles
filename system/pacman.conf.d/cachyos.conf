# system/pacman.conf.d/cachyos.conf — arquivo de REFERÊNCIA (doc 06: domínio system/, aplicado
# via bootstrap.sh com sudo, fora do alcance do chezmoi). Não é o /etc/pacman.conf inteiro —
# esse já existe no Arch instalado e não faz sentido substituir ele inteiro (perderíamos
# comentários/config local da instalação) — é só o bloco de repositórios do CachyOS (doc 02),
# pra anexar depois de rodar o instalador oficial deles.
#
# HONESTIDADE (mesma ressalva já registrada no doc 02): não consegui validar ao vivo o nome
# exato do script/pacote do instalador CachyOS nem os espelhos atuais nesta sessão (busca web
# falhando). O jeito certo e seguro de fazer isso é rodar o instalador oficial deles
# (`cachyos-repo.sh`, baixado de https://wiki.cachyos.org — confirmar o passo exato ali no
# momento da instalação) em vez de copiar mirrors/chaves GPG fixas aqui, que podem estar
# desatualizados quando você realmente for instalar. Esse instalador já:
#   1. Adiciona a chave GPG do repo CachyOS ao pacman
#   2. Detecta se sua CPU suporta x86-64-v3 (o i5-12450H suporta, doc 02) e escolhe a variante certa
#   3. Anexa os blocos [cachyos]/[cachyos-v3]/etc. a /etc/pacman.conf sozinho
#
# O bootstrap.sh (na raiz do repo) chama esse instalador oficial em vez de tentar recriar o
# efeito dele copiando este arquivo — este arquivo aqui existe só como DOCUMENTAÇÃO do que o
# instalador vai fazer, pra você conferir depois que rodar que bate com o esperado. Se um dia
# vertermos a decisão de fixar manualmente (ex: instalador oficial sumir), o bloco esperado tem
# essa cara (nomes de exemplo, CONFERIR contra a doc oficial antes de usar de verdade):
#
# [cachyos-v3]
# Include = /etc/pacman.d/cachyos-v3-mirrorlist
#
# [cachyos]
# Include = /etc/pacman.d/cachyos-mirrorlist

# --- Multilib (doc 02 não menciona diretamente, mas é padrão habilitar pra jogos/Wine/Steam
# eventuais e pra algumas libs 32-bit que o QEMU/virt-manager podem pedir) ---
# Descomentar as duas linhas equivalentes já existentes em /etc/pacman.conf (não duplicar aqui):
#   [multilib]
#   Include = /etc/pacman.d/mirrorlist
