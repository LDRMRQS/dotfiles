# /etc/sddm.conf.d/theme.conf — arquivo de sistema (doc 06: fora do alcance do chezmoi,
# aplicado via bootstrap.sh com sudo). Só seleciona qual tema o SDDM usa; o conteúdo do
# tema em si (Main.qml, cores) vem de home/dot_local/share/sddm-themes/arch-ricing/
# (chezmoi-managed) e é sincronizado pro caminho de sistema pelo hook
# run_after_10-sync-sddm-theme.sh — ver doc 07 "SDDM — tema" pro racional completo.
[Theme]
Current=arch-ricing
CursorTheme=Bibata-Modern-Classic
